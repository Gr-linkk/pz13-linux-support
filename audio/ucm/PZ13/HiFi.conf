# Exact mixer names verified on PZ13 kernels 7.2.8 and 7.2.9.
# Fixed hardware attenuation; desktop volume uses software attenuation.
# Keep the kernel's PA maximum 6 and WSA digital maximum 81 intact.
# Microphone +24 dB: normal speech captured at -11.8 dBFS peak, no clipping.
SectionVerb {
    EnableSequence [
        # AudioReach needs the backend links before a PCM device can be opened.
        cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 1"
        cset "name='WSA WSA_RX0 Digital Volume' 70"
        cset "name='WSA WSA_RX1 Digital Volume' 70"
        cset "name='SpkrLeft PA Volume' 4"
        cset "name='SpkrRight PA Volume' 4"
        cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
        cset "name='WSA WSA_COMP1 Switch' 0"
        cset "name='WSA WSA_COMP2 Switch' 0"
    ]
    DisableSequence [
        cset "name='WSA_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
        cset "name='MultiMedia2 Mixer VA_CODEC_DMA_TX_0' 0"
    ]
    Value { TQ "HiFi" }
}

SectionDevice."Speaker" {
    Comment "PZ13 speakers"
    EnableSequence [
        cset "name='SpkrLeft COMP Switch' 1"
        cset "name='SpkrLeft BOOST Switch' 1"
        cset "name='SpkrLeft DAC Switch' 1"
        cset "name='SpkrLeft PBR Switch' 0"
        cset "name='SpkrLeft VISENSE Switch' 0"
        cset "name='SpkrLeft WSA MODE' 0"
        cset "name='SpkrRight COMP Switch' 1"
        cset "name='SpkrRight BOOST Switch' 1"
        cset "name='SpkrRight DAC Switch' 1"
        cset "name='SpkrRight PBR Switch' 0"
        cset "name='SpkrRight VISENSE Switch' 0"
        cset "name='SpkrRight WSA MODE' 0"
        cset "name='WSA WSA_RX0 Digital Mute' 0"
        cset "name='WSA WSA_RX1 Digital Mute' 0"
        cset "name='WSA WSA RX0 MUX' AIF1_PB"
        cset "name='WSA WSA RX1 MUX' AIF1_PB"
        cset "name='WSA WSA_RX0 INP0' RX0"
        cset "name='WSA WSA_RX1 INP0' RX1"
    ]
    DisableSequence [
        cset "name='SpkrLeft DAC Switch' 0"
        cset "name='SpkrRight DAC Switch' 0"
        cset "name='WSA WSA_RX0 INP0' ZERO"
        cset "name='WSA WSA_RX1 INP0' ZERO"
        cset "name='WSA WSA RX0 MUX' ZERO"
        cset "name='WSA WSA RX1 MUX' ZERO"
    ]
    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
        PlaybackChannels 2
        PlaybackRate 48000
    }
}

SectionDevice."Mic" {
    Comment "PZ13 internal microphones"
    EnableSequence [
        cset "name='VA DEC0 MUX' VA_DMIC"
        cset "name='VA DMIC MUX0' DMIC0"
        cset "name='VA_AIF1_CAP Mixer DEC0' 1"
        cset "name='VA_DEC0 Volume' 108"
        cset "name='VA DEC1 MUX' VA_DMIC"
        cset "name='VA DMIC MUX1' DMIC1"
        cset "name='VA_AIF1_CAP Mixer DEC1' 1"
        cset "name='VA_DEC1 Volume' 108"
    ]
    DisableSequence [
        cset "name='VA_AIF1_CAP Mixer DEC0' 0"
        cset "name='VA_AIF1_CAP Mixer DEC1' 0"
        cset "name='VA DMIC MUX0' ZERO"
        cset "name='VA DMIC MUX1' ZERO"
    ]
    Value {
        CapturePriority 100
        CapturePCM "hw:${CardId},1"
        CaptureChannels 2
        CaptureRate 48000
    }
}
